plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def signingPath = System.getenv('IMPERIAL_SIGNING_PROPERTIES') ?: System.getProperty('user.home') + '/.config/imperial-school-views/android-signing.properties'
def signingFile = file(signingPath)
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }

android {
    namespace 'ru.oopssre.imperialschool.views'
    compileSdk 36
    defaultConfig {
        applicationId 'ru.oopssre.imperialschool.views'
        minSdk 26
        targetSdk 36
        versionCode 14
        versionName '1.3.9'
    }
    signingConfigs {
        publisher {
            if (signingFile.exists()) {
                storeFile = new File(signingFile.parentFile, signingValues.getProperty('storeFile'))
                storePassword = signingValues.getProperty('storePassword')
                keyAlias = signingValues.getProperty('keyAlias')
                keyPassword = signingValues.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.publisher; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' } }
}
dependencies {
    implementation 'org.mozilla:rhino:1.7.15.1'
    implementation 'org.brotli:dec:0.1.2'
    implementation 'androidx.work:work-runtime-ktx:2.11.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
tasks.register('exportRelease') {
    dependsOn 'assembleRelease'
    doLast {
        def apk = file('build/outputs/apk/release/app-release.apk')
        if (!signingFile.exists() || !apk.isFile()) throw new GradleException('Запустите build-android.sh для подписанной сборки.')
        def hash = java.security.MessageDigest.getInstance('SHA-256')
        apk.withInputStream { stream -> byte[] buffer = new byte[65536]; int n; while ((n=stream.read(buffer))>0) hash.update(buffer,0,n) }
        def sha = hash.digest().encodeHex().toString()
        def output = rootProject.file('dist'); output.mkdirs()
        def name = "imperial-school-views-android-${android.defaultConfig.versionName}-${sha.take(12)}.apk"
        java.nio.file.Files.copy(apk.toPath(),new File(output,name).toPath(),java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        new File(output,'android-release.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            schema:1,app_id:android.defaultConfig.applicationId,platform:'android',version:android.defaultConfig.versionName,build:android.defaultConfig.versionCode,sha256:sha
        ]))+'\n'
        println "Готово: dist/${name} и dist/android-release.json"
    }
}

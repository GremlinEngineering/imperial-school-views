name: macOS checks

on:
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/macos-checks.yml'
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - '.github/workflows/macos-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test the core and compile the native application
        run: ./macos/test-core.sh
      - name: Build the universal DMG and check its screen saver
        run: |
          ./macos/build-macos.sh --output "$RUNNER_TEMP/views-dist"
          bash macos/validation/check-saver.sh "$RUNNER_TEMP/views-dist/"*.dmg
